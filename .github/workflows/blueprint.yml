name: Blueprint and docs

# Builds the Lean project, the blueprint (web + PDF), checks that every
# \lean{...} name in the blueprint exists (checkdecls), builds the API docs,
# and deploys everything to GitHub Pages at
# https://geometrikz.github.io/econlib/
# Requires: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not cancel a running deploy: pushes are frequent and the first run (Mathlib
# API docs) is long. GitHub keeps the running job plus only the newest queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project, blueprint and docs
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true

      # Runs `leanblueprint pdf` and `leanblueprint web`, then
      # `lake exe checkdecls blueprint/lean_decls`, then API docs, then
      # Jekyll on home_page/, then deploys to Pages.
      # The first run builds Mathlib's API docs and is slow; later runs hit the cache.
      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          homepage: home_page
          # API docs are off: doc-gen failed on `srcUri.github` for every
          # dependency (run 45128674576). Blueprint "Lean" links go to
          # home_page/docs/find/, which redirects to GitHub code search.
          api-docs: "false"
